# ==============================================================================
# GitLab CI/CD Pipeline - DMB Mobile (Bank DMB)
# Standar Bank & OJK: Security gates -> Test -> Build -> Deploy Dev -> Deploy Prod (Manual)
#
# Required GitLab CI/CD Variables (set per Environment Scope: dev | production):
#   [Protected + Masked]
#   - SSH_PRIVATE_KEY           : ED25519 private key user deploy non-root
#   - SSH_KNOWN_HOSTS           : Output `ssh-keyscan -H <VPS_HOST>` (anti-MITM)
#   - VPS_USER                  : Username SSH non-root di server target
#   - VPS_HOST                  : IP / hostname server target
#   - SERVER_APP_DIR            : Path repo di server (default: /opt/mbanking-bpr)
#   - SERVER_ENV_FILE           : Path env file di luar repo (default: /etc/mbanking/dev.env atau prod.env)
#
#   [Mobile Build - scope: dev / production]
#   - DEV_API_BASE_URL          : URL API server dev (contoh: https://api-dev.bpr-dmb.co.id)
#   - API_BASE_URL              : URL API production (WAJIB https://)
#   - API_CERT_PINS             : Hash SPKI SHA-256 sertifikat SSL production (min. 2 pin)
#   - ANDROID_KEYSTORE_BASE64   : File release.jks dalam format base64 (Protected + Masked)
#   - ANDROID_KEY_PROPERTIES    : Isi android/key.properties (Protected + Masked)
# ==============================================================================

stages:
  - security
  - test
  - build-mobile
  - deploy-dev
  - deploy-prod

# ------------------------------------------------------------------------------
# 0. Security Gate (secret scanning)
# ------------------------------------------------------------------------------
secret-scan:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.18.4
    entrypoint: [""]
  script:
    - gitleaks detect --source . --redact --verbose

backend-vuln-scan:
  stage: security
  image: golang:1.26
  allow_failure: true
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

# ------------------------------------------------------------------------------
# 1. Quality & Automated Tests (Go Backend, Backoffice JS, Flutter Mobile)
# ------------------------------------------------------------------------------
backend-test:
  stage: test
  image: golang:1.26
  script:
    - 'test -z "$(gofmt -l ./internal ./pkg ./cmd ./config)" || (echo "File Go belum di-gofmt" && gofmt -l ./internal ./pkg ./cmd ./config && exit 1)'
    - go vet ./...
    - go test -count=1 ./internal/... ./config/... ./pkg/...

backoffice-js-check:
  stage: test
  image: node:20-alpine
  script:
    - for f in web/admin/js/*.js; do echo "Checking $f"; node --check "$f" || exit 1; done

mobile-test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:3.35.7
  script:
    - cd m_banking_bpr
    - flutter pub get
    - flutter analyze --no-fatal-infos
    - flutter test

# ------------------------------------------------------------------------------
# 2. Mobile Build (Dev & Production Release)
# ------------------------------------------------------------------------------
build-apk-dev:
  stage: build-mobile
  image: ghcr.io/cirruslabs/flutter:3.35.7
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "dev"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - 'test -n "$DEV_API_BASE_URL" || (echo "DEV_API_BASE_URL wajib diisi di CI/CD Variables scope dev" && exit 1)'
    - cd m_banking_bpr
    - flutter pub get
    - flutter build apk --release
        --dart-define-from-file=config/development.json
        --dart-define=API_BASE_URL="$DEV_API_BASE_URL"
    - cp build/app/outputs/flutter-apk/app-release.apk ../DMB-Mobile-Dev-$CI_COMMIT_SHORT_SHA.apk
  artifacts:
    name: "DMB-Mobile-Dev-$CI_COMMIT_SHORT_SHA"
    paths:
      - DMB-Mobile-Dev-*.apk
    expire_in: 7 days

build-apk-release:
  stage: build-mobile
  image: ghcr.io/cirruslabs/flutter:3.35.7
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  before_script:
    - flutter --version
    - test -n "$API_BASE_URL" || (echo "API_BASE_URL wajib diisi (https://...)" && exit 1)
    - case "$API_BASE_URL" in https://*) ;; *) echo "API_BASE_URL production wajib https://" && exit 1 ;; esac
    - test -n "$API_CERT_PINS" || (echo "API_CERT_PINS wajib diisi untuk release production" && exit 1)
    - test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 wajib diisi" && exit 1)
    - test -n "$ANDROID_KEY_PROPERTIES" || (echo "ANDROID_KEY_PROPERTIES wajib diisi" && exit 1)
    - cd m_banking_bpr
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
    - printf '%s\n' "$ANDROID_KEY_PROPERTIES" > android/key.properties
  script:
    - flutter pub get
    - flutter analyze --no-fatal-infos
    - flutter build apk --release --obfuscate --split-debug-info=build/symbols
        --dart-define-from-file=config/production.json
        --dart-define=API_BASE_URL="$API_BASE_URL"
        --dart-define=API_CERT_PINS="$API_CERT_PINS"
    - cp build/app/outputs/flutter-apk/app-release.apk ../DMB-Mobile-Release-$CI_COMMIT_SHORT_SHA.apk
  after_script:
    - rm -f m_banking_bpr/android/app/release.jks m_banking_bpr/android/key.properties
  artifacts:
    name: "DMB-Mobile-Prod-$CI_COMMIT_REF_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - DMB-Mobile-Release-*.apk
      - m_banking_bpr/build/symbols/
    expire_in: 30 days

# ------------------------------------------------------------------------------
# 3. Reusable Backend Deploy Template (Backup DB -> Migrate up/grants -> Restart -> Health Check)
# ------------------------------------------------------------------------------
.deploy_backend_template:
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - |
      APP_DIR="${SERVER_APP_DIR:-/opt/mbanking-bpr}"
      ENV_FILE="${SERVER_ENV_FILE:-/etc/mbanking/dev.env}"
      ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "set -euo pipefail
        cd '$APP_DIR'
        test -f '$ENV_FILE' || (echo 'Env file tidak ditemukan: $ENV_FILE' && exit 1)
        mkdir -p backups
        BACKUP_FILE=\"backups/pre_deploy_${CI_COMMIT_SHORT_SHA}_\$(date +%Y%m%d_%H%M%S).dump\"
        echo '[1/5] Backup PostgreSQL ke ' \"\$BACKUP_FILE\"
        docker compose --env-file '$ENV_FILE' exec -T postgres sh -c 'pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -F c' > \"\$BACKUP_FILE\"
        test -s \"\$BACKUP_FILE\" || (echo 'Backup database kosong/gagal; deploy dibatalkan!' && exit 1)
        echo '[2/5] Checkout commit $CI_COMMIT_SHA'
        git fetch origin
        git checkout --detach '$CI_COMMIT_SHA'
        echo '[3/5] Build image & jalankan migrasi (up + grants)'
        docker compose --env-file '$ENV_FILE' build migrate app
        docker compose --env-file '$ENV_FILE' run --rm migrate /app/migrate up
        docker compose --env-file '$ENV_FILE' run --rm migrate /app/migrate grants
        echo '[4/5] Restart container app'
        docker compose --env-file '$ENV_FILE' up -d app
        echo '[5/5] Verifikasi health endpoint'
        sleep 3
        curl -fsS http://127.0.0.1:8080/health >/dev/null
        echo 'Deploy selesai & sehat.'
      "

# ------------------------------------------------------------------------------
# 4. Deploy Backend ke Server DEV
# ------------------------------------------------------------------------------
deploy-backend-dev:
  extends: .deploy_backend_template
  stage: deploy-dev
  environment:
    name: dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "dev"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ------------------------------------------------------------------------------
# 5. Deploy Backend ke Server PRODUCTION (Wajib Manual Approval / Maker-Checker)
# ------------------------------------------------------------------------------
deploy-backend-prod:
  extends: .deploy_backend_template
  stage: deploy-prod
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
