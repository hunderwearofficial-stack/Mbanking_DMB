name: m_banking_bpr
description: "A modern Mobile Banking BPR application built with Flutter & Clean Architecture."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network & API
  dio: ^5.7.0

  # Local Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Utilities & UI Helpers
  intl: ^0.20.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

