# docker-compose untuk SERVER (staging / production). Untuk komputer sendiri gunakan
# docker-compose.local.yml (lihat docs/LOCAL_SETUP.md).
#
# SECURITY (audit DMB-007 / DMB-019):
# - Tidak ada secret di file ini. Nilai di-inject dari environment shell / secret manager
#   (`docker compose` membaca variabel shell; JANGAN menyimpan file kredensial production).
#   `${VAR:?...}` membuat compose menolak start bila variabel wajib kosong.
# - Tiga role database terpisah:
#     DB_OWNER_USER  pemilik skema (POSTGRES_USER), hanya dipakai service `migrate`
#     mbanking_app   role runtime aplikasi (bukan pemilik tabel → tidak dapat mematikan
#                    trigger audit_logs), dibuat otomatis oleh deploy/docker/postgres-init
#     mbanking_audit_reader  baca-saja audit trail (cmd/auditverify)
# - PostgreSQL & Redis tidak dipublikasikan ke internet (bind 127.0.0.1).
# - TLS diterminasi reverse proxy (deploy/nginx). APP_BIND_ADDR default 127.0.0.1.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mbanking_bpr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_OWNER_USER:?DB_OWNER_USER wajib diisi (role pemilik skema)}
      POSTGRES_PASSWORD: ${DB_OWNER_PASS:?DB_OWNER_PASS wajib diisi}
      POSTGRES_DB: ${DB_NAME:?DB_NAME wajib diisi}
      APP_DB_PASS: ${APP_DB_PASS:?APP_DB_PASS wajib diisi (password role mbanking_app)}
      AUDIT_DB_PASS: ${AUDIT_DB_PASS:?AUDIT_DB_PASS wajib diisi (password role mbanking_audit_reader)}
    ports:
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mbanking_bpr_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASS:?REDIS_PASS wajib diisi}", "--appendonly", "yes"]
    # Not published to the host.
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASS:?REDIS_PASS wajib diisi}

  # One-shot: menerapkan migrasi berversi sebagai pemilik skema, lalu selesai.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/migrate", "up"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV wajib diisi (staging/production)}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?DB_NAME wajib diisi}
      DB_USER: mbanking_app
      DB_SSL: ${DB_SSL:?DB_SSL wajib diisi}
      MIGRATION_DB_USER: ${DB_OWNER_USER:?DB_OWNER_USER wajib diisi}
      MIGRATION_DB_PASS: ${DB_OWNER_PASS:?DB_OWNER_PASS wajib diisi}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY wajib diisi}

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbanking_bpr_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_BIND_ADDR:-127.0.0.1}:8080:8080"
    environment:
      APP_NAME: MBanking-BPR-Backend
      APP_ENV: ${APP_ENV:?APP_ENV wajib diisi (staging/production)}
      APP_HOST: "" # semua interface di dalam container; binding host = APP_BIND_ADDR
      APP_PORT: "8080"
      APP_VERSION: ${APP_VERSION:?APP_VERSION wajib diisi}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: mbanking_app
      DB_PASS: ${APP_DB_PASS:?APP_DB_PASS wajib diisi}
      DB_NAME: ${DB_NAME:?DB_NAME wajib diisi}
      DB_SSL: ${DB_SSL:?DB_SSL wajib diisi (disable hanya untuk jaringan docker internal; verify-full untuk DB remote)}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASS: ${REDIS_PASS:?REDIS_PASS wajib diisi}
      REDIS_DB: "0"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET wajib diisi}
      ADMIN_JWT_EXPIRY_MINUTES: ${ADMIN_JWT_EXPIRY_MINUTES:-60}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_CHECKER_USERNAME: ${ADMIN_BOOTSTRAP_CHECKER_USERNAME:-}
      ADMIN_BOOTSTRAP_CHECKER_PASSWORD: ${ADMIN_BOOTSTRAP_CHECKER_PASSWORD:-}
      ADMIN_BOOTSTRAP_CHECKER_EMAIL: ${ADMIN_BOOTSTRAP_CHECKER_EMAIL:-}
      DB_ENCRYPTION_KEY: ${DB_ENCRYPTION_KEY:?DB_ENCRYPTION_KEY wajib diisi}
      DB_ENCRYPTION_KEY_PREVIOUS: ${DB_ENCRYPTION_KEY_PREVIOUS:-}
      CBS_WEBHOOK_SECRET: ${CBS_WEBHOOK_SECRET:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      DEVICE_BINDING_MODE: ${DEVICE_BINDING_MODE:?DEVICE_BINDING_MODE wajib diisi (dual atau enforced)}
      DEVICE_ATTESTATION_MODE: ${DEVICE_ATTESTATION_MODE:?DEVICE_ATTESTATION_MODE wajib diisi (observe atau enforce)}
      DEVICE_ATTESTATION_ANDROID_REQUIRE_VERIFIED_BOOT: ${DEVICE_ATTESTATION_ANDROID_REQUIRE_VERIFIED_BOOT:-true}
      DEVICE_ATTESTATION_ANDROID_ROOTS_FILE: ${DEVICE_ATTESTATION_ANDROID_ROOTS_FILE:-}
      DEVICE_ATTESTATION_ANDROID_REVOCATION_FILE: ${DEVICE_ATTESTATION_ANDROID_REVOCATION_FILE:-}
      DEVICE_ATTESTATION_ANDROID_PACKAGE: ${DEVICE_ATTESTATION_ANDROID_PACKAGE:-}
      DEVICE_ATTESTATION_ANDROID_CERT_SHA256: ${DEVICE_ATTESTATION_ANDROID_CERT_SHA256:-}
      DEVICE_ATTESTATION_APPLE_ROOT_FILE: ${DEVICE_ATTESTATION_APPLE_ROOT_FILE:-}
      DEVICE_ATTESTATION_APPLE_APP_ID: ${DEVICE_ATTESTATION_APPLE_APP_ID:-}
      DEVICE_ATTESTATION_APPLE_ENVIRONMENT: ${DEVICE_ATTESTATION_APPLE_ENVIRONMENT:-production}
      DEVICE_BINDING_OFF_REASON: ${DEVICE_BINDING_OFF_REASON:-}
      DEVICE_BINDING_OFF_UNTIL: ${DEVICE_BINDING_OFF_UNTIL:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-3}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_GATEWAY_ALLOWED_HOSTS: ${OTP_GATEWAY_ALLOWED_HOSTS:-}
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-}
      ADMIN_MAX_FAILED_LOGIN: ${ADMIN_MAX_FAILED_LOGIN:-5}
      ADMIN_LOCKOUT_MINUTES: ${ADMIN_LOCKOUT_MINUTES:-15}
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
      MAX_JSON_BODY_BYTES: ${MAX_JSON_BODY_BYTES:-1048576}
      ENABLE_MOCK_CBS: "false"
      CBS_BASE_URL: ${CBS_BASE_URL:?CBS_BASE_URL wajib diisi}
      CBS_CLIENT_ID: ${CBS_CLIENT_ID:?CBS_CLIENT_ID wajib diisi}
      CBS_CLIENT_SECRET: ${CBS_CLIENT_SECRET:?CBS_CLIENT_SECRET wajib diisi}
      CBS_TIMEOUT_SEC: ${CBS_TIMEOUT_SEC:-15}
    volumes:
      - ./web/admin/uploads:/app/web/admin/uploads
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1g }
    stop_grace_period: 20s # graceful shutdown (server menunggu request berjalan s.d. 10 detik)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
